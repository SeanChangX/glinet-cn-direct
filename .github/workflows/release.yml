name: release

# Scheduled publication. The build job is read-only and performs every safety
# check; only the publish job can write, and it runs solely when the build job
# succeeded. If any gate fails, nothing is pushed and the previous release stays
# active and authoritative.

on:
  schedule:
    # 22:30 UTC daily. GitHub cron is always UTC.
    #
    # GitHub applies no jitter or backoff to scheduled workflows: they queue,
    # and during high load a run is delayed or dropped outright rather than
    # retried. Load peaks at the top of every hour, so the minute is offset.
    # Missing a day is harmless here anyway - the previous release keeps
    # serving, which is the whole point of the fail-closed design.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Publish even if the generated files are unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      # Credentials are kept so the release branch can be fetched as the diff
      # baseline. This job's token is contents:read, so it can only read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check .

      - name: Run test suite
        run: python -m pytest -q

      - name: Fetch the currently published rules
        run: |
          mkdir -p previous
          if git fetch --depth 1 origin release; then
            git archive FETCH_HEAD | tar -x -C previous
            echo "Baseline commit: $(git rev-parse FETCH_HEAD)"
          else
            echo "No release branch yet; change-detection gates will be skipped."
          fi

      - name: Build rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m glinet_rules build --output dist --previous previous --audit audit

      - name: Validate GL.iNet grammar
        run: |
          python -m glinet_rules validate \
            dist/cn-ipv4.txt dist/cn-domains.txt dist/cn-direct.txt

      - name: Acceptance checks
        run: bash scripts/acceptance-checks.sh dist

      - name: Detect whether anything actually changed
        id: changed
        run: |
          changed=true
          if [ -f previous/cn-direct.txt ] \
             && cmp -s dist/cn-ipv4.txt previous/cn-ipv4.txt \
             && cmp -s dist/cn-domains.txt previous/cn-domains.txt \
             && cmp -s dist/cn-direct.txt previous/cn-direct.txt; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Generated files changed: $changed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rules
          path: |
            dist/
            audit/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.changed == 'true' || inputs.force_release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rules
          path: incoming

      - name: Re-run acceptance checks on the downloaded artifact
        # The artifact crossed a job boundary. Re-check it rather than assume it
        # is still exactly what the build job produced.
        run: bash scripts/acceptance-checks.sh incoming/dist

      - name: Compose commit message and release version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release-notes.py \
            --dist incoming/dist \
            --audit incoming/audit/report.json \
            --output "$RUNNER_TEMP/commit-message.txt"

          tags="$(gh release list --limit 200 --json tagName -q '.[].tagName' | tr '\n' ' ')"
          version="$(python -c "
          import json, pathlib, sys
          sys.path.insert(0, 'src')
          from glinet_rules.metadata import release_version
          meta = json.loads(pathlib.Path('incoming/dist/metadata.json').read_text())
          print(release_version(meta['generated_on'], sys.argv[1:]))
          " $tags)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Create the immutable release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd incoming/dist
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/commit-message.txt" \
            --target "$GITHUB_SHA" \
            cn-ipv4.txt cn-domains.txt cn-direct.txt checksums.txt metadata.json
          gh release upload "$VERSION" "$GITHUB_WORKSPACE/incoming/audit/report.json#audit-report.json"

      - name: Attest build provenance
        # Optional hardening. The GL.iNet subscription flow must not depend on
        # it, so a failure here is reported but does not block publication.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            incoming/dist/cn-ipv4.txt
            incoming/dist/cn-domains.txt
            incoming/dist/cn-direct.txt

      - name: Push generated rules to the release branch
        # Done last, because it replaces the working tree with generated files.
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/publish"
          rm -rf "$staging"
          cp -r incoming/dist "$staging"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch --depth 1 origin release
            git checkout -B release FETCH_HEAD
          else
            git checkout --orphan release
            git rm -rq --cached . || true
          fi

          # The release branch holds generated files only. Wipe it and write
          # exactly what the build produced, so a manual edit never survives.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "$staging"/. .

          git add -A
          if git diff --cached --quiet; then
            echo "Release branch already up to date."
          else
            git commit -F "$RUNNER_TEMP/commit-message.txt"
            git push origin release
          fi
