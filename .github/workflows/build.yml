name: build

# Validation only. This workflow can never write to the repository: it proves
# that the generator and its safety gates work, and that a real build against
# live upstream data would pass. Publishing lives in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The generator itself has zero runtime dependencies; pytest is the only
        # thing installed here, and only for the test job.
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

  dry-run:
    name: live build (dry run)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch the currently published rules
        # Used as the baseline for the change-detection gates. Absent on the
        # very first run, in which case those gates are skipped and reported.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          if git fetch --depth 1 origin release; then
            git archive FETCH_HEAD | tar -x -C previous
            echo "Baseline: $(git rev-parse --short FETCH_HEAD)"
          else
            echo "No release branch yet; diff gates will be skipped."
          fi

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet .
          python -m glinet_rules build --output dist --previous previous --audit audit

      - name: Validate generated files against the GL.iNet grammar
        run: |
          python -m glinet_rules validate \
            dist/cn-ipv4.txt dist/cn-domains.txt dist/cn-direct.txt

      - name: Assert no dangerous rule survived
        run: bash scripts/acceptance-checks.sh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-rules
          path: |
            dist/
            audit/
          retention-days: 14
