version: 2

updates:
  # Action SHA bumps. Dependabot rewrites the pinned SHA and keeps the version
  # comment in sync. These PRs are reviewed and merged by hand: an Action
  # update changes code that runs with publishing credentials.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Development dependencies only. The generator itself has none.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
