[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glinet-cn-direct"
version = "1.0.0"
description = "Auditable, fail-closed GL.iNet routing rules built from established upstream datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SeanChangX" }]
keywords = ["glinet", "routing", "vpn", "china", "geoip", "split-tunnel"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/SeanChangX/glinet-cn-direct"
Issues = "https://github.com/SeanChangX/glinet-cn-direct/issues"

[project.scripts]
glinet-rules = "glinet_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
