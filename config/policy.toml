# Build and security policy for glinet-cn-direct.
#
# Every threshold here is a fail-closed gate: if a value is exceeded the build
# stops and the previously published, known-good release stays active.

[general]
generator_version = "1.0.0"

[fetch]
# Network fetching limits (see SECURITY.md "Network fetching").
timeout_seconds = 120
max_redirects = 3
user_agent = "glinet-cn-direct/1.0 (+https://github.com/SeanChangX/glinet-cn-direct)"
ipv4_max_bytes = 10485760     # 10 MiB
domain_max_bytes = 52428800   # 50 MiB
# Reject a downloaded file if more than this fraction of its non-empty,
# non-comment lines cannot be parsed at all.
max_unparsable_percent = 1.0

[ipv4]
# --- absolute safety floors (independent of any previous release) ---
# Any network with prefixlen <= this is rejected unconditionally.
hard_reject_prefix_threshold = 4
# Any network with prefixlen <= this must appear in allowed_broad_networks.
broad_prefix_review_threshold = 8
allowed_broad_networks = []
# Sanity envelope for the whole set.
min_networks = 1000
max_networks = 200000
max_coverage_percent = 20.0

# --- change detection against the previous published release ---
max_rule_count_change_percent = 15.0
max_coverage_change_percent = 10.0
max_removed_percent = 10.0

[domains]
min_domains = 1000
max_domains = 500000
max_rule_count_change_percent = 15.0
max_removed_percent = 10.0
# Upstream entries that cannot be represented in GL.iNet grammar
# (keyword:, regexp:, malformed, ...). Counted per type, never converted.
unsupported_warn = 10
unsupported_fail = 500

[secondary]
# Independent comparator used only for anomaly detection. Never unioned.
enabled = true
# Fail if the primary and secondary domain sets diverge by more than this
# fraction of the primary set size.
max_domain_divergence_percent = 5.0
# Same idea for the IPv4 comparator, measured on address coverage.
max_ipv4_coverage_divergence_percent = 15.0
# A comparator that cannot be downloaded is a warning, not a build failure:
# it is a cross-check, not a source of truth.
required = false

[artifacts]
# Router practicality reporting (see README "Router limits").
max_lines_warn = 150000
max_bytes_warn = 4194304      # 4 MiB
